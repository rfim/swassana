<body data-page="info">
  <header class="nav scrolled">
    <div class="wrap nav-inner">

  <main class="wrap">
    <section class="page-hero">
      <p class="eyebrow">Tim Kami</p>
      <h1>Orang-orang di balik<br><em style="color:var(--accent);font-weight:300">setiap cerita</em></h1>
      <p class="lead">Tim kecil yang memastikan setiap sesi terasa hangat, rapi, dan menyenangkan.</p>
    </section>
    <section class="section" style="padding-top:24px">
      <div class="team" id="team"></div>
    </section>
  </main>
  <script>
    // Edit this list: name, role, short bio, optional photo path (e.g. "img/team/nama.jpg") and Instagram handle.
    const TEAM = [
      { name: 'Nama Founder', role: 'Founder & Creative Director', bio: 'Menggagas konsep visual kedua studio Swassana.', photo: '', ig: '' },
      { name: 'Nama Fotografer', role: 'Lead Photographer', bio: 'Mengarahkan pose dan cahaya di setiap sesi.', photo: '', ig: '' },
      { name: 'Nama Studio Manager', role: 'Studio Manager · Surabaya', bio: 'Menjaga jadwal dan kenyamanan tamu di Surabaya.', photo: '', ig: '' },
      { name: 'Nama Studio Manager', role: 'Studio Manager · Malang', bio: 'Menyambut tamu dan brand di Casa de Swassana.', photo: '', ig: '' },
      { name: 'Nama Admin', role: 'Admin & Customer Care', bio: 'Membantu booking dan menjawab pertanyaanmu.', photo: '', ig: '' },
      { name: 'Nama Editor', role: 'Photo Editor', bio: 'Menyempurnakan warna dan detail setiap foto.', photo: '', ig: '' }
    ];
    const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    document.getElementById('team').innerHTML = TEAM.map((m) => `
      <article class="member">
        <div class="avatar">${m.photo ? `<img src="${esc(m.photo)}" alt="${esc(m.name)}" loading="lazy">` : esc(m.name.replace(/^Nama /, '').charAt(0))}</div>
        <div class="member-body">
          <h3>${esc(m.name)}</h3>
          <p class="role">${esc(m.role)}</p>
          <p>${esc(m.bio)}</p>
          ${m.ig ? `<a class="ig-link" href="https://instagram.com/${esc(m.ig)}" target="_blank" rel="noopener">@${esc(m.ig)}</a>` : ''}
        </div>
      </article>`).join('');
  </script>
